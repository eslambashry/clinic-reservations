<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSuper — Product Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0F1A; --ink-2:#0D1424; --panel:#10182B; --panel-raised:#16213A; --panel-soft:#131C31;
  --line:#232E48; --line-soft:#1A2338; --paper:#E9EDF5; --muted:#8996B0; --muted-2:#5C6885;
  --pulse:#2FE6C8; --pulse-dim:#1B8577; --amber:#F2B84B; --amber-dim:#8A6620; --critical:#FF5D6C; --violet:#9C8CF0;
  --font-display:'Space Grotesk',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  --radius:10px; --sidebar-w:300px;
}
body.lang-ar{ --font-display:'Cairo',sans-serif; --font-body:'IBM Plex Sans Arabic',sans-serif; }
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ margin:0; background:var(--ink); color:var(--paper); font-family:var(--font-body); font-size:15.5px; line-height:1.7; -webkit-font-smoothing:antialiased; }
::selection{ background:var(--pulse); color:var(--ink); }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
[dir="ltr"] body, .ltr-force{ direction:ltr; }
.mono-tok{ font-family:var(--font-mono); direction:ltr; unicode-bidi:isolate; display:inline-block; }

body::before{
  content:""; position:fixed; inset:0;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:48px 48px; opacity:.35; pointer-events:none; z-index:0;
}

#pulseBar{ position:fixed; top:0; inset-inline:0; height:3px; z-index:200; background:var(--line-soft); }
#pulseFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--pulse-dim),var(--pulse)); box-shadow:0 0 12px 1px rgba(47,230,200,.55); transition:width .08s linear; }

.shell{ position:relative; z-index:1; display:flex; min-height:100vh; }
[dir="rtl"] .shell{ flex-direction:row-reverse; }

.sidebar{ width:var(--sidebar-w); flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
  border-inline-end:1px solid var(--line); background:linear-gradient(180deg,var(--ink-2),var(--ink) 40%); padding:22px 0 40px; }
.sidebar::-webkit-scrollbar{ width:8px; }
.sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

.brand{ padding:0 22px 16px; border-bottom:1px solid var(--line); margin-bottom:12px; }
.brand-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand-mark{ display:flex; align-items:center; gap:10px; }
.brand-dot{ width:10px; height:10px; border-radius:50%; background:var(--pulse); box-shadow:0 0 10px 2px rgba(47,230,200,.6); animation:blip 2.2s ease-in-out infinite; }
@keyframes blip{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.02em; }
.brand-sub{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; margin-top:6px; direction:ltr; }

.langtoggle{ display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; font-family:var(--font-mono); font-size:10.5px; }
.langtoggle button{ background:none; border:none; color:var(--muted); padding:5px 10px; cursor:pointer; font-family:inherit; font-size:inherit; }
.langtoggle button.active{ background:var(--pulse); color:var(--ink); font-weight:700; }

.toc-group{ padding:6px 12px; }
.toc-group-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); padding:14px 10px 6px; display:flex; align-items:center; gap:8px; }
.toc-group-label .tag{ padding:1px 6px; border-radius:4px; font-weight:600; font-size:9.5px; }
.toc-group-label.diag .tag{ background:rgba(242,184,75,.14); color:var(--amber); border:1px solid rgba(242,184,75,.35); }
.toc-group-label.treat .tag{ background:rgba(47,230,200,.12); color:var(--pulse); border:1px solid rgba(47,230,200,.35); }
.toc-link{ display:flex; gap:9px; align-items:baseline; padding:6px 10px; border-radius:7px; font-size:12.6px; color:var(--muted); cursor:pointer; transition:background .15s,color .15s; }
.toc-link:hover{ background:var(--panel-soft); color:var(--paper); }
.toc-link.active{ background:var(--panel-raised); color:var(--paper); }
.toc-link .num{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); min-width:24px; direction:ltr; }
.toc-link.active .num{ color:var(--pulse); }

.mobile-toggle{ display:none; }

.main{ flex:1; min-width:0; }
.wrap{ max-width:920px; margin:0 auto; padding:0 40px 120px; }

.hero{ padding:90px 40px 60px; max-width:1000px; }
.eyebrow{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--pulse); display:flex; align-items:center; gap:10px; margin-bottom:22px; }
.eyebrow::before{ content:""; width:26px; height:1px; background:var(--pulse); }
.hero h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(38px,7vw,72px); line-height:1.05; margin:0 0 18px; letter-spacing:-.01em; }
.hero h1 span{ color:var(--pulse); }
.hero .lede{ font-size:18px; color:var(--muted); max-width:660px; line-height:1.75; margin-bottom:40px; }
.hero .lede b{ color:var(--paper); font-weight:600; }

.vitals{ display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:46px; }
.vital{ background:var(--panel); padding:16px 14px; }
.vital .v-label{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }
.vital .v-num{ font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--paper); direction:ltr; }
.vital .v-num em{ color:var(--pulse); font-style:normal; }

.doc-cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.doc-card{ border:1px solid var(--line); border-radius:var(--radius); padding:24px; background:var(--panel); cursor:pointer; transition:transform .15s,border-color .15s; }
.doc-card:hover{ transform:translateY(-2px); border-color:var(--muted-2); }
.doc-card .dc-tag{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px; display:inline-block; padding:2px 8px; border-radius:5px; }
.doc-card.diag .dc-tag{ color:var(--amber); background:rgba(242,184,75,.12); border:1px solid rgba(242,184,75,.3); }
.doc-card.treat .dc-tag{ color:var(--pulse); background:rgba(47,230,200,.12); border:1px solid rgba(47,230,200,.3); }
.doc-card h3{ font-family:var(--font-display); font-size:22px; margin:6px 0 10px; }
.doc-card p{ color:var(--muted); font-size:13.5px; line-height:1.65; margin:0; }

.section{ padding:70px 0 10px; border-top:1px solid var(--line); scroll-margin-top:30px; }
.section:first-of-type{ border-top:none; }
.section-head{ margin-bottom:30px; }
.section-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.section-eyebrow .chip{ font-size:10px; padding:2px 7px; border-radius:5px; font-weight:600; }
.section-eyebrow .chip.diag{ color:var(--amber); background:rgba(242,184,75,.12); border:1px solid rgba(242,184,75,.3); }
.section-eyebrow .chip.treat{ color:var(--pulse); background:rgba(47,230,200,.12); border:1px solid rgba(47,230,200,.3); }
.section h2{ font-family:var(--font-display); font-size:clamp(24px,3.4vw,34px); margin:0 0 12px; letter-spacing:-.01em; line-height:1.25; }
.section .dek{ color:var(--muted); font-size:15px; max-width:680px; margin:0 0 8px; }
.section p{ color:var(--paper); }
.section p.muted-p{ color:var(--muted); }

.callout{ border-inline-start:3px solid var(--amber); background:rgba(242,184,75,.06); padding:14px 18px; border-radius:8px; font-size:13.8px; color:var(--paper); margin:18px 0; }
.callout.crit{ border-inline-start-color:var(--critical); background:rgba(255,93,108,.07); }
.callout.ok{ border-inline-start-color:var(--pulse); background:rgba(47,230,200,.06); }

.table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); margin:18px 0; }
table{ width:100%; border-collapse:collapse; font-size:13.3px; min-width:560px; }
thead th{ text-align:start; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:var(--panel-soft); padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
tbody td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); color:var(--paper); vertical-align:top; text-align:start; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--panel-soft); }
td.mono,th.mono{ font-family:var(--font-mono); font-size:12px; color:var(--pulse); white-space:nowrap; direction:ltr; }
td.dim{ color:var(--muted); }

.grid{ display:grid; gap:14px; margin:18px 0; }
.grid-2{ grid-template-columns:1fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.card{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:18px; }
.card h4{ font-family:var(--font-display); font-size:15.5px; margin:0 0 8px; color:var(--paper); }
.card p{ margin:0; color:var(--muted); font-size:13.2px; }
.card .k{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:6px; }

.persona{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:20px; }
.persona .p-role{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--pulse); margin-bottom:8px; }
.persona h4{ font-family:var(--font-display); font-size:17px; margin:0 0 10px; }
.persona p{ color:var(--muted); font-size:13px; margin:0; }

.badge{ display:inline-flex; align-items:center; font-family:var(--font-mono); font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
.badge.amber{ color:var(--amber); border-color:rgba(242,184,75,.4); background:rgba(242,184,75,.08); }
.badge.pulse{ color:var(--pulse); border-color:rgba(47,230,200,.4); background:rgba(47,230,200,.08); }
.badge.crit{ color:var(--critical); border-color:rgba(255,93,108,.4); background:rgba(255,93,108,.08); }

.method{ font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:.03em; direction:ltr; display:inline-block; }
.method.get{ color:#7FD1FF; background:rgba(127,209,255,.12); }
.method.post{ color:var(--pulse); background:rgba(47,230,200,.12); }
.method.patch{ color:var(--amber); background:rgba(242,184,75,.12); }

.qgroup{ border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--panel); }
.qgroup>summary{ list-style:none; cursor:pointer; padding:15px 18px; display:flex; justify-content:space-between; align-items:center; font-family:var(--font-display); font-weight:600; font-size:14.5px; background:var(--panel-soft); gap:10px; }
.qgroup>summary::-webkit-details-marker{ display:none; }
.qgroup>summary .qcount{ font-family:var(--font-mono); font-size:11px; color:var(--muted); font-weight:400; direction:ltr; }
.qgroup>summary::after{ content:"+"; font-family:var(--font-mono); color:var(--pulse); font-size:18px; }
.qgroup[open]>summary::after{ content:"–"; }
.qlist{ padding:6px 18px 16px; }
.qitem{ display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--line-soft); font-size:13.4px; }
.qitem:first-child{ border-top:none; }
.qitem .qn{ font-family:var(--font-mono); color:var(--amber); font-size:11.5px; min-width:28px; flex-shrink:0; padding-top:1px; direction:ltr; }
.qitem .qt{ color:var(--paper); }

.flow-title{ font-family:var(--font-mono); font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.1em; margin:22px 0 10px; }
.flow{ display:flex; flex-wrap:wrap; align-items:center; gap:0; margin:6px 0 20px; direction:ltr; text-align:left; }
.fnode{ font-family:var(--font-mono); font-size:11.5px; padding:8px 13px; border-radius:7px; border:1px solid var(--line); background:var(--panel-raised); color:var(--paper); white-space:nowrap; }
.fnode.start{ border-color:var(--muted-2); color:var(--muted); }
.fnode.ok{ border-color:rgba(47,230,200,.5); color:var(--pulse); background:rgba(47,230,200,.08); }
.fnode.warn{ border-color:rgba(242,184,75,.5); color:var(--amber); background:rgba(242,184,75,.08); }
.fnode.bad{ border-color:rgba(255,93,108,.5); color:var(--critical); background:rgba(255,93,108,.08); }
.farrow{ color:var(--muted-2); padding:0 8px; font-size:14px; }
.fbreak{ flex-basis:100%; height:8px; }
.fbranch{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); padding:0 6px; }

.timeline{ margin:18px 0; }
.tstep{ display:flex; gap:16px; padding:14px 0; border-top:1px solid var(--line-soft); }
.tstep:first-child{ border-top:none; padding-top:4px; }
.tstep .tn{ font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ink); background:var(--pulse); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tstep .tt{ font-size:13.8px; color:var(--paper); padding-top:3px; }

.rcard{ border:1px solid var(--line); border-inline-start:3px solid var(--muted-2); background:var(--panel); border-radius:8px; padding:14px 16px; }
.rcard.business{ border-inline-start-color:var(--violet); }
.rcard.technical{ border-inline-start-color:#7FD1FF; }
.rcard.operational{ border-inline-start-color:var(--amber); }
.rcard.legal{ border-inline-start-color:var(--critical); }
.rcard.health{ border-inline-start-color:var(--pulse); }
.rcard p{ margin:0; font-size:13.2px; color:var(--paper); }

.ecard{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:13px 16px; font-size:13px; color:var(--muted); }
.ecard:hover{ color:var(--paper); border-color:var(--muted-2); }

.subhead{ font-family:var(--font-display); font-weight:600; font-size:16px; margin:26px 0 12px; color:var(--paper); display:flex; align-items:center; gap:10px; }
.subhead .idx{ font-family:var(--font-mono); font-size:11px; color:var(--pulse); border:1px solid rgba(47,230,200,.3); background:rgba(47,230,200,.08); padding:2px 8px; border-radius:5px; direction:ltr; }

.svc{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:16px; position:relative; }
.svc .svc-n{ font-family:var(--font-mono); font-size:20px; color:var(--line); position:absolute; top:10px; inset-inline-end:14px; font-weight:700; }
.svc h4{ font-family:var(--font-display); font-size:14.5px; margin:0 0 8px; padding-inline-end:30px; }
.svc p{ margin:0; color:var(--muted); font-size:12.5px; }

.chk{ display:flex; gap:12px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line-soft); font-size:13.6px; }
.chk:first-child{ border-top:none; }
.chk .box{ width:16px; height:16px; border:1.5px solid var(--muted-2); border-radius:4px; flex-shrink:0; margin-top:2px; }
.chk.warn .box{ border-color:var(--critical); background:rgba(255,93,108,.1); }

.codepanel{ background:var(--panel-soft); border:1px solid var(--line); border-radius:var(--radius); padding:20px; overflow-x:auto; margin:18px 0; direction:ltr; text-align:left; }
.codepanel pre{ margin:0; font-family:var(--font-mono); font-size:12px; line-height:1.7; color:var(--pulse); white-space:pre; }
.codepanel pre .dim{ color:var(--muted-2); }

.kpi{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:14px 16px; }
.kpi .k-metric{ font-family:var(--font-mono); font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
.kpi .k-val{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--pulse); direction:ltr; }
.kpi .k-goal{ font-size:12px; color:var(--muted); margin-top:4px; }

.footer{ border-top:1px solid var(--line); margin-top:90px; padding:40px 0 60px; color:var(--muted-2); font-size:12.5px; }
.footer .fmark{ font-family:var(--font-mono); letter-spacing:.1em; text-transform:uppercase; font-size:10.5px; color:var(--muted); margin-bottom:8px; }

.totop{ position:fixed; inset-inline-end:26px; bottom:26px; z-index:150; width:42px; height:42px; border-radius:50%; background:var(--panel-raised); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--pulse); cursor:pointer; font-family:var(--font-mono); font-size:16px; opacity:0; pointer-events:none; transition:opacity .2s; }
.totop.show{ opacity:1; pointer-events:auto; }

ul.plain, ol.plain{ margin:0; padding-inline-start:18px; color:var(--paper); font-size:13.4px; line-height:1.9; }

@media (max-width:980px){
  .sidebar{ position:fixed; inset-inline-start:-320px; top:0; z-index:190; transition:inset-inline-start .2s; background:var(--ink); width:280px; }
  .sidebar.open{ inset-inline-start:0; box-shadow:20px 0 60px rgba(0,0,0,.5); }
  .mobile-toggle{ display:flex; position:fixed; top:14px; inset-inline-start:14px; z-index:195; width:42px; height:42px; border-radius:10px; background:var(--panel-raised); border:1px solid var(--line); align-items:center; justify-content:center; color:var(--pulse); cursor:pointer; }
  .hero{ padding-top:90px; }
  .vitals{ grid-template-columns:repeat(2,1fr); }
  .doc-cards{ grid-template-columns:1fr; }
  .grid-2,.grid-3{ grid-template-columns:1fr; }
  .wrap,.hero{ padding-inline:22px; }
}
</style>
</head>
<body>

<div id="pulseBar"><div id="pulseFill"></div></div>
<div class="mobile-toggle" id="mobileToggle">☰</div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark"><div class="brand-dot"></div><div class="brand-name">MedSuper</div></div>
        <div class="langtoggle" id="langToggle">
          <button data-lang="en" class="active">EN</button><button data-lang="ar">AR</button>
        </div>
      </div>
      <div class="brand-sub" id="brandSub">Product Record · v1.0</div>
    </div>
    <div id="tocRoot"></div>
  </nav>

  <main class="main">
    <div class="wrap" id="pageTop">
      <section class="hero" id="heroRoot"></section>
      <div id="sectionsRoot"></div>
      <div class="footer" id="footerRoot"></div>
    </div>
  </main>
</div>

<div class="totop" id="totop">↑</div>

<script>
window.LANG = 'en';
function t(pair){ if(pair==null) return ''; if(typeof pair==='string') return pair; return pair[window.LANG] || pair.en || ''; }
function mono(s){ return '<span class="mono-tok">'+s+'</span>'; }

/* ============================================================
   SECTION REGISTRY (metadata only — id, group, number, title)
   ============================================================ */
const SECTIONS = [
 {id:'d-exec',        g:'diag', n:'1',  t:{en:'Executive Summary', ar:'الملخص التنفيذي'}},
 {id:'d-vision',      g:'diag', n:'2',  t:{en:'Product Vision', ar:'رؤية المنتج'}},
 {id:'d-goals',       g:'diag', n:'3',  t:{en:'Business Goals', ar:'أهداف العمل'}},
 {id:'d-stakeholders',g:'diag', n:'4',  t:{en:'Stakeholders', ar:'أصحاب المصلحة'}},
 {id:'d-usertypes',   g:'diag', n:'5',  t:{en:'User Types', ar:'أنواع المستخدمين'}},
 {id:'d-scope',       g:'diag', n:'6',  t:{en:'Product Scope', ar:'نطاق المنتج'}},
 {id:'d-modules',     g:'diag', n:'7',  t:{en:'High-Level Modules', ar:'الوحدات الرئيسية'}},
 {id:'d-journeys',    g:'diag', n:'8',  t:{en:'User Journeys', ar:'رحلات المستخدم'}},
 {id:'d-workflows',   g:'diag', n:'9',  t:{en:'Business Workflows', ar:'مسارات العمل'}},
 {id:'d-questions',   g:'diag', n:'10', t:{en:'Discovery Questions', ar:'أسئلة الاستكشاف'}},
 {id:'d-rules',       g:'diag', n:'11', t:{en:'Business Rules (Proposed)', ar:'قواعد العمل (مقترحة)'}},

/* ============================================================
   GENERIC RENDER HELPERS
   ============================================================ */
function chip(g){ return g==='diag'
  ? '<span class="chip diag">'+t({en:'Volume I · Diagnosis',ar:'الجزء الأول · التشخيص'})+'</span>'
  : '<span class="chip treat">'+t({en:'Volume II · Treatment Plan',ar:'الجزء الثاني · خطة العلاج'})+'</span>'; }

function secHead(meta, title, dek){
  const volLabel = meta.g==='diag' ? t({en:'Volume I',ar:'الجزء الأول'}) : t({en:'Volume II',ar:'الجزء الثاني'});
  return '<div class="section-head">'
    +'<div class="section-eyebrow">'+chip(meta.g)+' <span class="mono-tok">§'+meta.n+'</span> '+t(meta.t)+'</div>'
    +'<h2>'+t(title)+'</h2>'
    +(dek ? '<p class="dek">'+t(dek)+'</p>' : '')
    +'</div>';
}
function card(title, body){ return '<div class="card"><h4>'+t(title)+'</h4><p>'+t(body)+'</p></div>'; }
function kcard(k, body){ return '<div class="card"><div class="k">'+t(k)+'</div><p>'+t(body)+'</p></div>'; }
function list(items, ordered){ const tag = ordered?'ol':'ul';
  return '<'+tag+' class="plain">'+items.map(i=>'<li>'+t(i)+'</li>').join('')+'</'+tag+'>'; }
function tbl(headers, rows){
  return '<div class="table-wrap"><table><thead><tr>'
    + headers.map(h=>'<th>'+t(h)+'</th>').join('')
    + '</tr></thead><tbody>'
    + rows.map(r=>'<tr>'+r.map(c=>'<td'+(c.cls?(' class="'+c.cls+'"'):'')+'>'+(c.html!==undefined?c.html:t(c))+'</td>').join('')+'</tr>').join('')
    + '</tbody></table></div>';
}
function qaGroups(groups, openFirst){
  let n = 1;
  return groups.map((grp,i)=>{
    const rows = grp.items.map(it=>{ const row = '<div class="qitem"><div class="qn">'+(grp.noNum?'—':('#'+n))+'</div><div class="qt">'+t(it)+'</div></div>'; n++; return row; }).join('');
    return '<details class="qgroup"'+(openFirst&&i===0?' open':'')+'><summary>'+t(grp.title)+' <span class="qcount">'+grp.items.length+' '+t({en:'items',ar:'عنصر'})+'</span></summary><div class="qlist">'+rows+'</div></details>';
  }).join('');
}
function timeline(items){ return '<div class="timeline">'+items.map((it,i)=>'<div class="tstep"><div class="tn">'+(i+1)+'</div><div class="tt">'+t(it)+'</div></div>').join('')+'</div>'; }
function cardGrid(items, cols){ return '<div class="grid grid-'+(cols||3)+'">'+items.map(([ti,d])=>card(ti,d)).join('')+'</div>'; }
function ecardGrid(items, cols){ return '<div class="grid grid-'+(cols||2)+'">'+items.map(i=>'<div class="ecard">'+t(i)+'</div>').join('')+'</div>'; }
function flowHtml(nodes){
  return '<div class="flow">'+nodes.map(n=>{
    if(n.br) return '<div class="fbreak"></div>';
    if(n.arrow) return '<div class="farrow">→</div>';
    const note = n.note ? ' <span class="fbranch">['+t(n.note)+']</span>' : '';
    return '<div class="fnode '+(n.cls||'')+'">'+n.label+note+'</div>';
  }).join('')+'</div>';
}
function subhead(idx, label){ return '<div class="subhead"><span class="idx">'+idx+'</span> '+t(label)+'</div>'; }
function riskGroup(cls, title, items){
  return subhead(title.idx, title.t) + '<div class="grid">'+items.map(([ti,d])=>'<div class="rcard '+cls+'"><p><b>'+t(ti)+'</b> — '+t(d)+'</p></div>').join('')+'</div>';
}
function checklist(items, warn){ return items.map(i=>'<div class="chk '+(warn?'warn':'')+'"><div class="box"></div><div>'+t(i)+'</div></div>').join(''); }

  const flow3 = flowHtml([

    {cls:'bad', label:t({en:'[gap: no critical-value escalation]',ar:'[ثغرة: لا تصعيد للقيم الحرجة]'})},
  ]);
  return secHead(meta, {en:'As described — with every gap marked in place.', ar:'كما وردت — مع تعليم كل ثغرة في مكانها.'})
  + subhead('9.1', {en:'Appointment Workflow', ar:'مسار الموعد'}) + flow1
  + '<p class="muted-p" style="font-size:13.2px;">' + t({en:'No explicit "check-in" or "visit completed" state is described, and no defined trigger separates a completed visit from a no-show.', ar:'لا حالة صريحة لـ"تسجيل الوصول" أو "اكتمال الزيارة"، ولا محفّز محدد يفصل الزيارة المكتملة عن التغيب.'}) + '</p>'
  + subhead('9.2', {en:'Prescription (Pharmacy) Workflow', ar:'مسار الوصفة (الصيدلية)'}) + flow2
  + '<p class="muted-p" style="font-size:13.2px;">' + t({en:'No defined delivery/pickup mechanic, and no defined "fulfilled/completed" trigger before the sale is recorded.', ar:'لا آلية محددة للتوصيل/الاستلام، ولا محفّز محدد لـ"التنفيذ/الاكتمال" قبل تسجيل عملية البيع.'}) + '</p>'
  + subhead('9.3', {en:'Laboratory Workflow', ar:'مسار المختبر'}) + flow3
  + subhead('9.4', {en:'Payment Workflow — the single largest gap', ar:'مسار الدفع — أكبر ثغرة منفردة'})
  + '<div class="callout crit">' + t({en:'The brief only states payment can be "Deposit, Full payment, Cash, Online" at booking time. It does <b>not</b> define what triggers a deposit vs. full payment, what happens to a deposit on rejection or no-show, how pharmacy/lab payments work at all, platform commission mechanics, refund timelines, or provider payout schedules. <b>This should be a primary discussion topic in the first client meeting.</b>',
      ar:'يذكر المستند فقط أن الدفع يمكن أن يكون "عربون، دفع كامل، نقدًا، إلكتروني" وقت الحجز. لكنه <b>لا</b> يحدد ما الذي يستدعي العربون مقابل الدفع الكامل، ولا مصير العربون عند الرفض أو التغيب، ولا كيفية عمل مدفوعات الصيدلية/المختبر إطلاقًا، ولا آلية عمولة المنصة، ولا الجداول الزمنية للاسترداد أو الدفع للمزودين. <b>يجب أن يكون هذا الموضوع الرئيسي في أول اجتماع مع العميل.</b>'}) + '</div>'
  + subhead('9.5–9.6', {en:'Cancellation & Notification Workflows — entirely undefined', ar:'مساري الإلغاء والإشعارات — غير محددين إطلاقًا'})
  + '<p class="muted-p" style="font-size:13.4px;">' + t({en:'No cancellation policy, fee structure, or time-based rule is mentioned anywhere for any of the three services — this must be defined before any payment logic can be built. Notifications are implied ("patient notified") but channel, urgency handling, and failed-delivery fallback are never defined.',
      ar:'لا سياسة إلغاء، ولا هيكل رسوم، ولا قاعدة زمنية مذكورة في أي مكان لأي من الخدمات الثلاث — يجب تحديد هذا قبل بناء أي منطق دفع. الإشعارات ضمنية ("تم إخطار المريض") لكن القناة ومعالجة الإلحاح والبديل عند فشل التسليم غير محددة أبدًا.'}) + '</p>';

CONTENT['d-edgecases'] = function(){
  const meta = SECTIONS.find(s=>s.id==='d-edgecases');
  return secHead(meta, {en:'A living set — each finalized rule tends to surface 3–5 more.', ar:'مجموعة حية — كل قاعدة تُحسم تكشف عادة ٣-٥ حالات إضافية.'})
  + DISCOVERY_EDGE_CASES.map(g=>{
      const parts = t(g.k).split(' ');
      return subhead(parts[0], parts.slice(1).join(' ')) + ecardGrid(g.items, 2);
    }).join('');
};

CONTENT['d-risks'] = function(){
  const meta = SECTIONS.find(s=>s.id==='d-risks');
  return secHead(meta, {en:'Business, technical, operational, legal, and healthcare-specific.', ar:'تجارية، تقنية، تشغيلية، قانونية، وخاصة بالرعاية الصحية.'})

};

function buildNav(){
  const diag = SECTIONS.filter(s=>s.g==='diag');
  const treat = SECTIONS.filter(s=>s.g==='treat');
  const groupHtml = (items, label, cls, tagTxt) => `
    <div class="toc-group">
      <div class="toc-group-label ${cls}"><span class="tag">${tagTxt}</span>${label}</div>
      ${items.map(it=>`<div class="toc-link" data-id="${it.id}" onclick="jump('${it.id}')"><span class="num">${it.n}</span><span>${t(it.t)}</span></div>`).join('')}
    </div>`;
  document.getElementById('tocRoot').innerHTML =
    groupHtml(diag, t({en:'Diagnosis',ar:'التشخيص'}), 'diag', t({en:'Vol. I',ar:'ج. ١'}))
    + groupHtml(treat, t({en:'Treatment Plan',ar:'خطة العلاج'}), 'treat', t({en:'Vol. II',ar:'ج. ٢'}));

function renderSections(){
  document.getElementById('sectionsRoot').innerHTML = SECTIONS.map(s => {
    const fn = CONTENT[s.id];
    return `<section class="section" id="${s.id}">${fn ? fn() : ''}</section>`;
  }).join('');
}

function renderAll(){
  document.getElementById('brandSub').textContent = t({en:'Product Record · v1.0', ar:'سجل المنتج · إصدار ١.٠'});
  renderHero();
  buildNav();
  renderSections();
  renderFooter();
  bindScrollspy();
}

function jump(id){
  const elm = document.getElementById(id);
  if(elm) elm.scrollIntoView({behavior:'smooth', block: id==='pageTop' ? 'end' : 'start'});
  document.getElementById('sidebar').classList.remove('open');
}
window.jump = jump;

let tocLinks = {};
let allSectionEls = [];
function bindScrollspy(){
  tocLinks = {};
  document.querySelectorAll('.toc-link').forEach(l=>{ tocLinks[l.dataset.id] = l; });
  allSectionEls = SECTIONS.map(s=>document.getElementById(s.id)).filter(Boolean);
  onScroll();
}

function onScroll(){
  const doc = document.documentElement;
  const scrolled = doc.scrollTop || document.body.scrollTop;
  const height = doc.scrollHeight - doc.clientHeight;
  const pct = height > 0 ? (scrolled/height)*100 : 0;
  document.getElementById('pulseFill').style.width = pct + '%';
  document.getElementById('totop').classList.toggle('show', scrolled > 700);

  let current = null;
  for(const sec of allSectionEls){
    const rect = sec.getBoundingClientRect();
    if(rect.top <= 140) current = sec.id;
  }
  if(current){
    Object.values(tocLinks).forEach(l=>l.classList.remove('active'));
    if(tocLinks[current]){
      tocLinks[current].classList.add('active');
      if(typeof tocLinks[current].scrollIntoView === 'function'){
        tocLinks[current].scrollIntoView({block:'nearest'});
      }
    }
  }
}
document.addEventListener('scroll', onScroll, {passive:true});
document.getElementById('totop').addEventListener('click', ()=>jump('pageTop'));

document.getElementById('mobileToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

document.getElementById('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const lang = btn.dataset.lang;
  if(lang === window.LANG) return;
  window.LANG = lang;
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  const html = document.getElementById('htmlRoot');
  html.setAttribute('lang', lang);
  html.setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
  document.body.classList.toggle('lang-ar', lang==='ar');
  const scrollFrac = (document.documentElement.scrollTop||document.body.scrollTop) / Math.max(1,(document.documentElement.scrollHeight - document.documentElement.clientHeight));
  renderAll();
  window.scrollTo(0, scrollFrac * (document.documentElement.scrollHeight - document.documentElement.clientHeight));
});

renderAll();
</script>
