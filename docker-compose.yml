services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: medsuper
      POSTGRES_PASSWORD: medsuper
      POSTGRES_DB: medsuper
    ports:
      - '5432:5432'
    volumes:
      - medsuper_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  medsuper_postgres_data:
